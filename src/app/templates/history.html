{% extends "base.html" %}
{% block title %}Drafting history: {{ entity.name }} · LoreWeaver{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <p class="muted"><a href="/{{ etype.key }}/{{ entity.id }}">{{ entity.name }}</a></p>
    <h1>Drafting history</h1>
  </div>
</div>
{% if review.brief %}<p><span class="muted">Brief:</span> {{ review.brief }}</p>{% endif %}
<section class="review-panel">
  {% include "_version_view.html" %}
</section>
{% endblock %}
