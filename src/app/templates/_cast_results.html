{% if results %}
<ul class="anchor-results">
  {% for r in results %}
  <li>
    <button type="button" hx-post="/encounters/{{ comp_id }}/cast/{{ r.entity.id }}">
      <span class="type-tag">{{ entity_types[r.entity.type].label }}</span> {{ r.name_html }}
      {% if r.entity.status == "draft" %}<span class="badge badge-draft">undecided</span>{% endif %}
    </button>
  </li>
  {% endfor %}
</ul>
{% elif query.strip() %}
<p class="hint">Nothing that can join a cast matches “{{ query }}”.</p>
{% endif %}
