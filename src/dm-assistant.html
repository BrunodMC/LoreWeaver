<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Arcane Table — DM Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Crimson+Pro:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1510;
    --parchment: #f2e8d5;
    --parchment-dark: #e8d9bc;
    --parchment-deep: #d4c4a0;
    --gold: #b8922a;
    --gold-light: #d4ac44;
    --gold-dim: #7a5f1a;
    --crimson: #8b1a1a;
    --crimson-light: #c0392b;
    --mist: #6b6055;
    --mist-light: #9a8e80;
    --shadow: rgba(0,0,0,0.35);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0d0b08;
    color: var(--parchment);
    font-family: 'Crimson Pro', Georgia, serif;
    font-size: 17px;
    line-height: 1.6;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Atmospheric background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 20% 10%, rgba(184,146,42,0.06) 0%, transparent 70%),
      radial-gradient(ellipse 40% 60% at 80% 80%, rgba(139,26,26,0.05) 0%, transparent 70%),
      repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(255,255,255,0.005) 2px,
        rgba(255,255,255,0.005) 4px
      );
    pointer-events: none;
    z-index: 0;
  }

  .app {
    position: relative;
    z-index: 1;
    max-width: 860px;
    margin: 0 auto;
    padding: 0 24px 60px;
  }

  /* Header */
  header {
    text-align: center;
    padding: 48px 0 32px;
    border-bottom: 1px solid rgba(184,146,42,0.2);
    margin-bottom: 36px;
    position: relative;
  }

  header::after {
    content: '⬥';
    position: absolute;
    bottom: -10px;
    left: 50%;
    transform: translateX(-50%);
    color: var(--gold);
    background: #0d0b08;
    padding: 0 12px;
    font-size: 12px;
  }

  .title {
    font-family: 'Cinzel', serif;
    font-size: 28px;
    font-weight: 600;
    color: var(--gold-light);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .subtitle {
    color: var(--mist-light);
    font-style: italic;
    font-size: 15px;
    margin-top: 6px;
    font-weight: 300;
    letter-spacing: 0.03em;
  }

  /* API key section */
  .api-section {
    background: rgba(242,232,213,0.04);
    border: 1px solid rgba(184,146,42,0.15);
    border-radius: 6px;
    padding: 16px 20px;
    margin-bottom: 32px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .api-label {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--gold-dim);
    text-transform: uppercase;
    white-space: nowrap;
  }

  .api-input {
    flex: 1;
    min-width: 200px;
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(184,146,42,0.2);
    border-radius: 4px;
    padding: 8px 12px;
    color: var(--parchment);
    font-family: 'Crimson Pro', serif;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
  }

  .api-input:focus { border-color: rgba(184,146,42,0.5); }
  .api-input::placeholder { color: var(--mist); }

  .api-status {
    font-size: 13px;
    color: var(--mist);
    font-style: italic;
  }
  .api-status.ok { color: #6b9e6b; }

  /* Context strip */
  .context-strip {
    background: rgba(242,232,213,0.04);
    border: 1px solid rgba(184,146,42,0.12);
    border-radius: 6px;
    padding: 14px 20px;
    margin-bottom: 28px;
  }

  .context-label {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--gold-dim);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .context-fields {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .ctx-input {
    background: rgba(0,0,0,0.35);
    border: 1px solid rgba(184,146,42,0.15);
    border-radius: 4px;
    padding: 7px 10px;
    color: var(--parchment);
    font-family: 'Crimson Pro', serif;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
  }
  .ctx-input:focus { border-color: rgba(184,146,42,0.4); }
  .ctx-input::placeholder { color: var(--mist); font-style: italic; }

  /* Section heading */
  .section-heading {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--gold-dim);
    text-transform: uppercase;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-heading::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(to right, rgba(184,146,42,0.25), transparent);
  }

  /* Action buttons grid */
  .actions-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
    margin-bottom: 28px;
  }

  .action-btn {
    background: rgba(242,232,213,0.04);
    border: 1px solid rgba(184,146,42,0.2);
    border-radius: 6px;
    padding: 16px 18px;
    cursor: pointer;
    text-align: left;
    transition: all 0.18s ease;
    position: relative;
    overflow: hidden;
  }

  .action-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(184,146,42,0.06), transparent);
    opacity: 0;
    transition: opacity 0.18s;
  }

  .action-btn:hover {
    border-color: rgba(184,146,42,0.45);
    transform: translateY(-1px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  .action-btn:hover::before { opacity: 1; }
  .action-btn:active { transform: translateY(0); }

  .action-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
  }

  .btn-icon {
    font-size: 22px;
    margin-bottom: 8px;
    display: block;
  }

  .btn-title {
    font-family: 'Cinzel', serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: var(--gold-light);
    display: block;
    margin-bottom: 4px;
  }

  .btn-desc {
    font-size: 13px;
    color: var(--mist-light);
    font-style: italic;
    font-weight: 300;
    line-height: 1.4;
    display: block;
  }

  /* Free prompt area */
  .free-prompt-area {
    margin-bottom: 28px;
  }

  .prompt-row {
    display: flex;
    gap: 10px;
  }

  .free-input {
    flex: 1;
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(184,146,42,0.2);
    border-radius: 6px;
    padding: 12px 16px;
    color: var(--parchment);
    font-family: 'Crimson Pro', serif;
    font-size: 16px;
    outline: none;
    transition: border-color 0.2s;
    resize: vertical;
    min-height: 52px;
  }
  .free-input:focus { border-color: rgba(184,146,42,0.45); }
  .free-input::placeholder { color: var(--mist); font-style: italic; }

  .send-btn {
    background: rgba(184,146,42,0.12);
    border: 1px solid rgba(184,146,42,0.4);
    border-radius: 6px;
    padding: 12px 20px;
    color: var(--gold-light);
    font-family: 'Cinzel', serif;
    font-size: 12px;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: all 0.18s;
    white-space: nowrap;
    align-self: flex-end;
  }
  .send-btn:hover {
    background: rgba(184,146,42,0.2);
    border-color: rgba(184,146,42,0.7);
  }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Output area */
  .output-area {
    background: rgba(242,232,213,0.03);
    border: 1px solid rgba(184,146,42,0.15);
    border-radius: 8px;
    min-height: 160px;
    padding: 24px 28px;
    position: relative;
  }

  .output-area.loading .output-content::after {
    content: '▋';
    animation: blink 0.8s step-end infinite;
    color: var(--gold);
  }

  @keyframes blink { 50% { opacity: 0; } }

  .output-placeholder {
    color: var(--mist);
    font-style: italic;
    font-size: 15px;
    text-align: center;
    padding: 30px 0;
  }

  .output-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(184,146,42,0.12);
  }

  .output-type {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 0.14em;
    color: var(--gold);
    text-transform: uppercase;
  }

  .copy-btn {
    background: none;
    border: 1px solid rgba(184,146,42,0.2);
    border-radius: 4px;
    padding: 4px 10px;
    color: var(--mist-light);
    font-family: 'Cinzel', serif;
    font-size: 9px;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: all 0.15s;
  }
  .copy-btn:hover { border-color: rgba(184,146,42,0.5); color: var(--gold-light); }

  .output-content {
    color: var(--parchment);
    font-size: 16px;
    line-height: 1.75;
    white-space: pre-wrap;
    font-weight: 300;
  }

  .output-content strong, .output-content b {
    color: var(--gold-light);
    font-weight: 400;
  }

  /* Sections rendered from markdown-ish output */
  .output-section-title {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    letter-spacing: 0.08em;
    color: var(--gold);
    text-transform: uppercase;
    margin: 18px 0 8px;
  }

  /* Error state */
  .output-error {
    color: #c0392b;
    font-style: italic;
    font-size: 15px;
  }

  /* History pills */
  .history-strip {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }

  .history-pill {
    background: rgba(242,232,213,0.05);
    border: 1px solid rgba(184,146,42,0.15);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 12px;
    color: var(--mist-light);
    cursor: pointer;
    transition: all 0.15s;
    font-style: italic;
  }
  .history-pill:hover { border-color: rgba(184,146,42,0.4); color: var(--parchment); }

  /* Spinner */
  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid rgba(184,146,42,0.2);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin-right: 8px;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Footer */
  footer {
    text-align: center;
    margin-top: 48px;
    padding-top: 20px;
    border-top: 1px solid rgba(184,146,42,0.1);
    color: var(--mist);
    font-size: 13px;
    font-style: italic;
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="title">The Arcane Table</div>
    <div class="subtitle">A Daggerheart DM Assistant</div>
  </header>

  <!-- API Key -->
  <div class="api-section">
    <span class="api-label">Anthropic API Key</span>
    <input type="password" class="api-input" id="apiKey" placeholder="sk-ant-..." oninput="checkKey()">
    <span class="api-status" id="apiStatus">Not set</span>
  </div>

  <!-- Session context -->
  <div class="context-strip">
    <div class="context-label">Session Context</div>
    <div class="context-fields">
      <input type="text" class="ctx-input" id="ctxParty" placeholder="Party size & tier (e.g. 4 players, Tier 1)">
      <input type="text" class="ctx-input" id="ctxLocation" placeholder="Current location (e.g. Thornwood forest)">
      <input type="text" class="ctx-input" id="ctxTone" placeholder="Tone (e.g. dark, hopeful, gritty)">
      <input type="text" class="ctx-input" id="ctxNotes" placeholder="Any quick notes for this session">
    </div>
  </div>

  <!-- Quick Actions -->
  <div class="section-heading">Quick Actions</div>
  <div class="actions-grid">

    <button class="action-btn" onclick="runAction('encounter')">
      <span class="btn-icon">⚔️</span>
      <span class="btn-title">Encounter</span>
      <span class="btn-desc">Generate a scene, enemies & stakes</span>
    </button>

    <button class="action-btn" onclick="runAction('npc')">
      <span class="btn-icon">🎭</span>
      <span class="btn-title">NPC</span>
      <span class="btn-desc">Instant name, look & personality</span>
    </button>

    <button class="action-btn" onclick="runAction('loot')">
      <span class="btn-icon">💰</span>
      <span class="btn-title">Loot</span>
      <span class="btn-desc">Treasure, items & curiosities</span>
    </button>

    <button class="action-btn" onclick="runAction('location')">
      <span class="btn-icon">🗺️</span>
      <span class="btn-title">Location</span>
      <span class="btn-desc">Vivid description of a new place</span>
    </button>

    <button class="action-btn" onclick="runAction('complication')">
      <span class="btn-icon">🌀</span>
      <span class="btn-title">Complication</span>
      <span class="btn-desc">A twist or unexpected development</span>
    </button>

    <button class="action-btn" onclick="runAction('rumour')">
      <span class="btn-icon">📜</span>
      <span class="btn-title">Rumour</span>
      <span class="btn-desc">A hook, secret or local gossip</span>
    </button>

  </div>

  <!-- Free prompt -->
  <div class="section-heading">Custom Prompt</div>
  <div class="free-prompt-area">
    <div class="history-strip" id="historyStrip"></div>
    <div class="prompt-row">
      <textarea class="free-input" id="freePrompt" rows="2"
        placeholder="Describe what's happening at the table..."
        onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault();sendFree();}"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendFree()">Invoke</button>
    </div>
  </div>

  <!-- Output -->
  <div class="section-heading">The Oracle Speaks</div>
  <div class="output-area" id="outputArea">
    <div class="output-placeholder" id="outputPlaceholder">
      Set your API key, add session context, then choose an action or write your own prompt.
    </div>
    <div id="outputInner" style="display:none">
      <div class="output-header">
        <span class="output-type" id="outputType">—</span>
        <button class="copy-btn" onclick="copyOutput()">Copy</button>
      </div>
      <div class="output-content" id="outputContent"></div>
    </div>
  </div>

  <footer>Daggerheart is a game by Darrington Press · This tool uses the Anthropic API</footer>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
const history = [];
let isLoading = false;

// ── Key check ─────────────────────────────────────────────────────────────
function checkKey() {
  const k = document.getElementById('apiKey').value.trim();
  const s = document.getElementById('apiStatus');
  if (k.startsWith('sk-ant-') && k.length > 20) {
    s.textContent = 'Ready';
    s.className = 'api-status ok';
  } else {
    s.textContent = k.length > 0 ? 'Invalid format' : 'Not set';
    s.className = 'api-status';
  }
}

// ── Context helpers ────────────────────────────────────────────────────────
function getContext() {
  const party    = document.getElementById('ctxParty').value.trim();
  const location = document.getElementById('ctxLocation').value.trim();
  const tone     = document.getElementById('ctxTone').value.trim();
  const notes    = document.getElementById('ctxNotes').value.trim();
  const parts = [];
  if (party)    parts.push(`Party: ${party}`);
  if (location) parts.push(`Location: ${location}`);
  if (tone)     parts.push(`Tone: ${tone}`);
  if (notes)    parts.push(`Notes: ${notes}`);
  return parts.length ? `\n\nSession context:\n${parts.join('\n')}` : '';
}

const SYSTEM = `You are a creative assistant for a Daggerheart TTRPG game master.
Daggerheart is a narrative, hope/fear-driven system by Darrington Press. It uses 2d12 (Hope die + Fear die), features Adversaries instead of monsters, and leans into collaborative storytelling.
Be evocative, specific and immediately usable. Keep responses focused and structured. Use markdown-style bold for key terms/names. Avoid padding. Think like a practised GM.`;

// ── Prompts per action ─────────────────────────────────────────────────────
const PROMPTS = {
  encounter: (ctx) => `Generate a vivid Daggerheart encounter.${ctx}

Structure your response as:
**Scene** — 2-3 sentences of atmosphere and setting.
**Adversaries** — 2-3 enemies with a name, one-line description, and a single interesting ability each (Daggerheart style: give them a Move and a Reaction).
**Stakes** — What happens if the players fail? What unexpected angle could make this memorable?
**Fear Opportunity** — One thing the GM can do when spending a Fear token to escalate tension.`,

  npc: (ctx) => `Generate a memorable NPC for a Daggerheart session.${ctx}

Structure your response as:
**Name & Appearance** — Name, one striking visual detail.
**First Impression** — What do players notice in the first 10 seconds?
**Personality** — Two traits in tension with each other.
**Secret or Want** — Something they're hiding or desperately need.
**Hook** — One way they could draw the players deeper into a story.`,

  loot: (ctx) => `Generate interesting loot for a Daggerheart party.${ctx}

Give 3-5 items. For each:
**Item name** — Brief evocative description. If it has a mechanical effect, keep it simple and Daggerheart-compatible (bonus to a roll, advantage, or a once-per-session ability). Include at least one mundane-but-interesting item with narrative value.`,

  location: (ctx) => `Describe a new location the party has just entered.${ctx}

Structure your response as:
**Name** — A striking, specific name.
**Atmosphere** — 2-3 sentences: what do they see, hear, smell?
**Detail** — One specific, unusual thing in this place that rewards investigation.
**Danger or Mystery** — Something that isn't right. Could be subtle.
**NPC presence** — Who (if anyone) is here, in one line.`,

  complication: (ctx) => `Generate an unexpected complication or twist for the current scene.${ctx}

Give 3 options of varying severity:
**Minor** — A wrinkle that adds tension without derailing.
**Moderate** — A development that forces a decision.
**Major** — A revelation or crisis that changes something fundamental.
Each in 2-3 sentences. Make them feel earned, not random.`,

  rumour: (ctx) => `Generate 3 rumours, hooks or pieces of local gossip.${ctx}

For each:
**Rumour** — What people are saying (1-2 sentences).
**Truth** — What's actually going on (1-2 sentences, could be the same, more interesting, or a complete lie).

Make them varied: one local/mundane, one mysterious, one dangerous.`,
};

// ── Run a quick action ─────────────────────────────────────────────────────
function runAction(type) {
  if (isLoading) return;
  const ctx = getContext();
  const prompt = PROMPTS[type](ctx);
  const labels = {
    encounter: 'Encounter',
    npc: 'NPC',
    loot: 'Loot',
    location: 'Location',
    complication: 'Complication',
    rumour: 'Rumour',
  };
  callClaude(prompt, labels[type]);
}

// ── Free prompt ────────────────────────────────────────────────────────────
function sendFree() {
  if (isLoading) return;
  const input = document.getElementById('freePrompt');
  const text = input.value.trim();
  if (!text) return;
  addHistory(text);
  const ctx = getContext();
  const prompt = ctx ? `${text}${ctx}` : text;
  callClaude(prompt, 'Custom');
  input.value = '';
}

function addHistory(text) {
  const short = text.length > 40 ? text.slice(0, 40) + '…' : text;
  history.unshift({ text, short });
  if (history.length > 5) history.pop();
  renderHistory();
}

function renderHistory() {
  const strip = document.getElementById('historyStrip');
  strip.innerHTML = history.map((h, i) =>
    `<span class="history-pill" onclick="rerun(${i})">${h.short}</span>`
  ).join('');
}

function rerun(i) {
  if (isLoading) return;
  const ctx = getContext();
  const prompt = ctx ? `${history[i].text}${ctx}` : history[i].text;
  callClaude(prompt, 'Custom');
}

// ── Claude API call (streaming) ────────────────────────────────────────────
async function callClaude(prompt, label) {
  const key = document.getElementById('apiKey').value.trim();
  if (!key) {
      showError('No API key found. Check your config.json file.');
      return;
  }

  setLoading(true, label);
  let fullText = '';

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 1024,
        stream: true,
        system: SYSTEM,
        messages: [{ role: 'user', content: prompt }],
      }),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      const detail = JSON.stringify(err, null, 2);
      throw new Error(`${err.error?.message || 'API error ' + res.status}\n\nFull response:\n${detail}`);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const chunk = decoder.decode(value, { stream: true });
      const lines = chunk.split('\n');
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6).trim();
        if (data === '[DONE]') continue;
        try {
          const parsed = JSON.parse(data);
          if (parsed.type === 'content_block_delta' && parsed.delta?.text) {
            fullText += parsed.delta.text;
            renderOutput(fullText, label);
          }
        } catch {}
      }
    }

  } catch (err) {
    showError(err.message);
  } finally {
    setLoading(false, label);
  }
}

// ── UI helpers ─────────────────────────────────────────────────────────────
function setLoading(on, label) {
  isLoading = on;
  const area = document.getElementById('outputArea');
  const sendBtn = document.getElementById('sendBtn');
  const allBtns = document.querySelectorAll('.action-btn');

  sendBtn.disabled = on;
  allBtns.forEach(b => b.disabled = on);

  if (on) {
    area.classList.add('loading');
    document.getElementById('outputPlaceholder').style.display = 'none';
    document.getElementById('outputInner').style.display = 'block';
    document.getElementById('outputType').innerHTML =
      `<span class="spinner"></span>${label}`;
    document.getElementById('outputContent').textContent = '';
  } else {
    area.classList.remove('loading');
    document.getElementById('outputType').textContent = label;
  }
}

function renderOutput(text, label) {
  document.getElementById('outputPlaceholder').style.display = 'none';
  document.getElementById('outputInner').style.display = 'block';
  document.getElementById('outputType').textContent = label;

  // Simple markdown bold rendering
  const html = text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  document.getElementById('outputContent').innerHTML = html;
}

function showError(msg) {
  document.getElementById('outputPlaceholder').style.display = 'none';
  document.getElementById('outputInner').style.display = 'block';
  document.getElementById('outputType').textContent = 'Error';
  document.getElementById('outputContent').innerHTML =
    `<span class="output-error">${msg}</span>`;
}

function copyOutput() {
  const text = document.getElementById('outputContent').innerText;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.copy-btn');
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy', 1500);
  });
}

async function loadConfig() {
  try {
    const res = await fetch('./config.json');
    if (!res.ok) return;
    const config = await res.json();
    if (config.apiKey) {
      document.getElementById('apiKey').value = config.apiKey;
      checkKey();
    }
  } catch {}
}

loadConfig();

</script>
</body>
</html>
